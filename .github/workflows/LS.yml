name: Build ImmortalWrt 24.10 - JCG Q30 SSR Plus Minimal

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  DEVICE: jcg_q30
  DEFAULT_IP: 192.168.222.1

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:

    # ============================================================
    # 1. 清理空间
    # ============================================================
    - name: Free disk space
      run: |
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache
        sudo apt-get clean
        df -h

    # ============================================================
    # 2. 编译环境
    # ============================================================
    - name: Install dependencies
      run: |
        sudo apt-get update

        sudo apt-get install -y \
          build-essential \
          clang \
          flex \
          bison \
          gawk \
          gettext \
          git \
          libncurses5-dev \
          libncursesw5-dev \
          libssl-dev \
          python3 \
          python3-setuptools \
          rsync \
          unzip \
          zlib1g-dev \
          file \
          wget \
          curl \
          ccache \
          rename \
          xsltproc \
          swig \
          time \
          jq

    # ============================================================
    # 3. 下载 ImmortalWrt 24.10
    # ============================================================
    - name: Clone ImmortalWrt 24.10
      run: |
        git clone \
          --depth=1 \
          --branch=openwrt-24.10 \
          https://github.com/immortalwrt/immortalwrt.git \
          openwrt

        cd openwrt

        echo "=========================================="
        echo "ImmortalWrt commit"
        echo "=========================================="

        git log -1 --oneline

    # ============================================================
    # 4. feeds
    # ============================================================
    - name: Configure feeds
      working-directory: openwrt
      run: |

        cat > feeds.conf.default <<'EOF'
        src-git packages https://github.com/immortalwrt/packages.git
        src-git luci https://github.com/immortalwrt/luci.git
        src-git routing https://github.com/openwrt/routing.git
        src-git telephony https://git.openwrt.org/feed/telephony.git

        src-git kenzo https://github.com/kenzok8/openwrt-packages.git
        src-git small https://github.com/kenzok8/small.git
        EOF

        ./scripts/feeds update -a

        ./scripts/feeds install -a

    # ============================================================
    # 5. 选择 JCG Q30
    # ============================================================
    - name: Verify JCG Q30 target
      working-directory: openwrt
      run: |

        echo "=========================================="
        echo "JCG Q30 Target"
        echo "=========================================="

        grep -R \
          "jcg_q30" \
          target/linux/mediatek \
          2>/dev/null || true

    # ============================================================
    # 6. 极度精简配置
    # ============================================================
    - name: Generate minimal configuration
      working-directory: openwrt
      run: |

        cat > .config <<'EOF'

        #
        # ==========================================================
        # Target
        # ==========================================================
        #

        CONFIG_TARGET_mediatek=y
        CONFIG_TARGET_mediatek_filogic=y
        CONFIG_TARGET_mediatek_filogic_DEVICE_jcg_q30=y


        #
        # ==========================================================
        # LuCI
        # ==========================================================
        #

        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-ssl=y

        CONFIG_PACKAGE_luci-base=y
        CONFIG_PACKAGE_luci-mod-admin-full=y

        CONFIG_PACKAGE_luci-theme-bootstrap=y

        CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
        CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y


        #
        # ==========================================================
        # SSH
        # ==========================================================
        #

        CONFIG_PACKAGE_dropbear=y


        #
        # ==========================================================
        # IPv4
        # ==========================================================
        #

        CONFIG_PACKAGE_dnsmasq=y

        CONFIG_PACKAGE_ip-full=y

        CONFIG_PACKAGE_iptables=y
        CONFIG_PACKAGE_iptables-mod-tproxy=y

        CONFIG_PACKAGE_iptables-mod-conntrack-extra=y


        #
        # ==========================================================
        # IPv6
        # ==========================================================
        #

        CONFIG_PACKAGE_odhcp6c=y
        CONFIG_PACKAGE_odhcp6c_ext_cer_id=0

        CONFIG_PACKAGE_odhcpd-ipv6only=y

        CONFIG_PACKAGE_luci-proto-ipv6=y


        #
        # ==========================================================
        # Firewall / TPROXY
        # ==========================================================
        #

        CONFIG_PACKAGE_firewall4=y

        CONFIG_PACKAGE_kmod-nft-core=y
        CONFIG_PACKAGE_kmod-nft-nat=y
        CONFIG_PACKAGE_kmod-nft-tproxy=y

        CONFIG_PACKAGE_kmod-ipt-tproxy=y

        CONFIG_PACKAGE_kmod-nf-conntrack=y
        CONFIG_PACKAGE_kmod-nf-conntrack6=y

        CONFIG_PACKAGE_kmod-nf-nat=y
        CONFIG_PACKAGE_kmod-nf-nat6=y


        #
        # ==========================================================
        # SSR Plus+
        # ==========================================================
        #

        CONFIG_PACKAGE_luci-app-ssr-plus=y


        #
        # ==========================================================
        # Xray
        # ==========================================================
        #

        CONFIG_PACKAGE_xray-core=y


        #
        # ==========================================================
        # V2Ray
        # ==========================================================
        #

        CONFIG_PACKAGE_v2ray-core=y


        #
        # ==========================================================
        # Trojan
        # ==========================================================
        #

        CONFIG_PACKAGE_trojan=y


        #
        # ==========================================================
        # Hysteria2
        # ==========================================================
        #

        CONFIG_PACKAGE_hysteria=y


        #
        # ==========================================================
        # SSL
        # ==========================================================
        #

        CONFIG_PACKAGE_ca-bundle=y
        CONFIG_PACKAGE_ca-certificates=y

        CONFIG_PACKAGE_libustream-openssl=y


        #
        # ==========================================================
        # 网络基础
        # ==========================================================
        #

        CONFIG_PACKAGE_kmod-tun=y


        #
        # ==========================================================
        # 删除其它代理
        # ==========================================================
        #

        CONFIG_PACKAGE_luci-app-passwall=n
        CONFIG_PACKAGE_luci-app-passwall2=n

        CONFIG_PACKAGE_luci-app-homeproxy=n

        CONFIG_PACKAGE_luci-app-openclash=n

        CONFIG_PACKAGE_sing-box=n

        CONFIG_PACKAGE_mosdns=n
        CONFIG_PACKAGE_mosdns-v5=n
        CONFIG_PACKAGE_luci-app-mosdns=n

        CONFIG_PACKAGE_smartdns=n
        CONFIG_PACKAGE_luci-app-smartdns=n

        CONFIG_PACKAGE_kcptun-client=n
        CONFIG_PACKAGE_kcptun-server=n


        #
        # ==========================================================
        # 删除 Shadowsocks / SSR
        # ==========================================================
        #

        CONFIG_PACKAGE_shadowsocks-libev-ss-local=n
        CONFIG_PACKAGE_shadowsocks-libev-ss-redir=n
        CONFIG_PACKAGE_shadowsocks-libev-ss-server=n

        CONFIG_PACKAGE_shadowsocksr-libev-ss-local=n
        CONFIG_PACKAGE_shadowsocksr-libev-ss-redir=n
        CONFIG_PACKAGE_shadowsocksr-libev-ss-server=n


        #
        # ==========================================================
        # 删除其它科学上网插件
        # ==========================================================
        #

        CONFIG_PACKAGE_luci-app-adguardhome=n
        CONFIG_PACKAGE_adguardhome=n

        CONFIG_PACKAGE_luci-app-v2ray-server=n

        CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Shadowsocks=n
        CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_ShadowsocksR_Server=n
        CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_ShadowsocksR_Client=n
        CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_ShadowsocksR_Redirect=n
        CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Kcptun=n
        CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_NaiveProxy=n
        CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Brook=n
        CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_ChinaDNS_NG=n
        CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Simple_Obfs=n
        CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Redsocks2=n


        #
        # ==========================================================
        # 删除 NAS
        # ==========================================================
        #

        CONFIG_PACKAGE_samba4-server=n
        CONFIG_PACKAGE_samba4-libs=n
        CONFIG_PACKAGE_samba4-utils=n

        CONFIG_PACKAGE_luci-app-samba4=n


        #
        # ==========================================================
        # 删除下载
        # ==========================================================
        #

        CONFIG_PACKAGE_aria2=n
        CONFIG_PACKAGE_luci-app-aria2=n


        #
        # ==========================================================
        # 删除 QoS
        # ==========================================================
        #

        CONFIG_PACKAGE_kmod-sched-cake=n
        CONFIG_PACKAGE_kmod-sched-core=n
        CONFIG_PACKAGE_tc-full=n
        CONFIG_PACKAGE_luci-app-sqm=n


        #
        # ==========================================================
        # 删除 UPnP
        # ==========================================================
        #

        CONFIG_PACKAGE_luci-app-upnp=n
        CONFIG_PACKAGE_miniupnpd=n


        #
        # ==========================================================
        # 删除 DLNA
        # ==========================================================
        #

        CONFIG_PACKAGE_luci-app-minidlna=n
        CONFIG_PACKAGE_minidlna=n


        #
        # ==========================================================
        # 删除 USB
        # ==========================================================
        #

        CONFIG_PACKAGE_kmod-usb-core=n
        CONFIG_PACKAGE_kmod-usb3=n
        CONFIG_PACKAGE_kmod-usb-storage=n
        CONFIG_PACKAGE_kmod-usb-storage-uas=n


        #
        # ==========================================================
        # 删除文件系统工具
        # ==========================================================
        #

        CONFIG_PACKAGE_fdisk=n
        CONFIG_PACKAGE_mount-utils=n
        CONFIG_PACKAGE_block-mount=n

        CONFIG_PACKAGE_e2fsprogs=n
        CONFIG_PACKAGE_mkfs-ext4=n

        CONFIG_PACKAGE_kmod-fs-ext4=n
        CONFIG_PACKAGE_kmod-fs-vfat=n
        CONFIG_PACKAGE_kmod-fs-exfat=n


        #
        # ==========================================================
        # 删除 Shell / 大型工具
        # ==========================================================
        #

        CONFIG_PACKAGE_bash=n
        CONFIG_PACKAGE_gawk=n
        CONFIG_PACKAGE_getopt=n

        CONFIG_PACKAGE_htop=n
        CONFIG_PACKAGE_procps-ng=n

        CONFIG_PACKAGE_coreutils=n
        CONFIG_PACKAGE_coreutils-base64=n

        CONFIG_PACKAGE_bsdtar=n
        CONFIG_PACKAGE_tar=n
        CONFIG_PACKAGE_pigz=n


        #
        # ==========================================================
        # 删除 OpenSSH
        # ==========================================================
        #

        CONFIG_PACKAGE_openssh-client=n
        CONFIG_PACKAGE_openssh-server=n
        CONFIG_PACKAGE_openssh-sftp-server=n


        #
        # ==========================================================
        # 删除其它 LuCI 插件
        # ==========================================================
        #

        CONFIG_PACKAGE_luci-app-commands=n
        CONFIG_PACKAGE_luci-app-package-manager=n
        CONFIG_PACKAGE_luci-app-opkg=n
        CONFIG_PACKAGE_luci-app-statistics=n
        CONFIG_PACKAGE_luci-app-ddns=n
        CONFIG_PACKAGE_luci-app-watchcat=n
        CONFIG_PACKAGE_luci-app-attendedsysupgrade=n


        #
        # ==========================================================
        # Build
        # ==========================================================
        #

        CONFIG_DEVEL=n
        CONFIG_CCACHE=y

        EOF


    # ============================================================
    # 7. LAN / IPv6 / 默认系统
    # ============================================================
    - name: Configure network
      working-directory: openwrt
      run: |

        mkdir -p files/etc/uci-defaults

        cat > files/etc/uci-defaults/99-jcg-q30-network <<'EOF'
        #!/bin/sh

        #
        # LAN IPv4
        #

        uci set network.lan.ipaddr='192.168.222.1'
        uci set network.lan.netmask='255.255.255.0'

        #
        # IPv6
        #

        uci set network.lan.ip6assign='64'

        #
        # IPv6 WAN
        #

        if uci get network.wan6 >/dev/null 2>&1; then
            uci set network.wan6.proto='dhcpv6'
            uci set network.wan6.reqaddress='try'
            uci set network.wan6.reqprefix='auto'
        fi

        uci commit network

        exit 0
        EOF

        chmod +x files/etc/uci-defaults/99-jcg-q30-network


        #
        # 默认 hostname
        #

        mkdir -p files/etc/config

        cat > files/etc/config/system <<'EOF'
        config system
            option hostname 'JCG-Q30'
            option timezone 'CST-8'
            option zonename 'Asia/Shanghai'
            option log_size '64'

        config timeserver 'ntp'
            list server 'ntp.aliyun.com'
            list server 'time1.cloud.tencent.com'
            list server 'time.cloudflare.com'
            option enabled '1'
        EOF


    # ============================================================
    # 8. 极简网络优化
    # ============================================================
    - name: Network optimization
      working-directory: openwrt
      run: |

        cat >> files/etc/sysctl.conf <<'EOF'

        net.netfilter.nf_conntrack_max=65535

        net.core.netdev_max_backlog=4096

        net.ipv4.tcp_fastopen=3

        EOF


    # ============================================================
    # 9. SSR Plus 协议检查
    # ============================================================
    - name: Check SSR Plus configuration
      working-directory: openwrt
      run: |

        echo "=========================================="
        echo "SSR Plus / Proxy packages"
        echo "=========================================="

        grep -E \
          'luci-app-ssr-plus|xray|v2ray|trojan|hysteria' \
          .config || true


    # ============================================================
    # 10. Defconfig
    # ============================================================
    - name: Defconfig
      working-directory: openwrt
      run: |

        make defconfig

        echo
        echo "=========================================="
        echo "FINAL TARGET"
        echo "=========================================="

        grep '^CONFIG_TARGET_' .config | grep '=y' || true

        echo
        echo "=========================================="
        echo "PROXY PACKAGES"
        echo "=========================================="

        grep -E \
          '^CONFIG_PACKAGE_(luci-app-ssr-plus|xray-core|v2ray-core|trojan|hysteria)' \
          .config || true

        echo
        echo "=========================================="
        echo "UNWANTED PROXY PACKAGES"
        echo "=========================================="

        grep -E \
          'passwall|homeproxy|openclash|sing-box|mosdns|smartdns|kcptun' \
          .config || true


    # ============================================================
    # 11. 下载源码
    # ============================================================
    - name: Download packages
      working-directory: openwrt
      run: |

        make download \
          -j$(nproc) \
          V=s


    # ============================================================
    # 12. 编译
    # ============================================================
    - name: Compile firmware
      working-directory: openwrt
      run: |

        make \
          -j$(nproc) \
          V=s


    # ============================================================
    # 13. 整理固件
    # ============================================================
    - name: Collect firmware
      working-directory: openwrt
      run: |

        mkdir -p /tmp/q30-firmware

        find bin/targets/mediatek/filogic/ \
          -maxdepth 1 \
          -type f \
          -exec cp {} /tmp/q30-firmware/ \;

        echo
        echo "=========================================="
        echo "JCG Q30 Firmware"
        echo "=========================================="

        ls -lh /tmp/q30-firmware

        echo
        echo "=========================================="
        echo "SHA256"
        echo "=========================================="

        cd /tmp/q30-firmware

        sha256sum *


    # ============================================================
    # 14. 上传固件
    # ============================================================
    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: ImmortalWrt-24.10-JCG-Q30-SSRPlus-Mini
        path: /tmp/q30-firmware/*
        retention-days: 30


    # ============================================================
    # 15. GitHub Release
    # ============================================================
    - name: Create release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: JCG-Q30-24.10-SSRPlus-${{ github.run_number }}
        name: JCG Q30 ImmortalWrt 24.10 SSR Plus Minimal ${{ github.run_number }}
        files: /tmp/q30-firmware/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
