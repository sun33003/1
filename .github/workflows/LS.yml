name: JCG Q30 ImmortalWrt 24.10 SSR Plus MINI

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:

    # ==========================================================
    # 1. 清理 GitHub Actions 空间
    # ==========================================================
    - name: Free disk space
      run: |
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache
        sudo apt-get clean
        df -h

    # ==========================================================
    # 2. 安装编译依赖
    # ==========================================================
    - name: Install dependencies
      run: |
        sudo apt-get update

        sudo apt-get install -y \
          build-essential \
          clang \
          flex \
          bison \
          gawk \
          gettext \
          git \
          libncurses5-dev \
          libncursesw5-dev \
          libssl-dev \
          python3 \
          python3-setuptools \
          rsync \
          unzip \
          zlib1g-dev \
          file \
          wget \
          curl \
          xsltproc \
          swig \
          time \
          jq

    # ==========================================================
    # 3. 下载 ImmortalWrt 24.10
    # ==========================================================
    - name: Clone ImmortalWrt 24.10
      run: |
        git clone \
          --depth=1 \
          --single-branch \
          --branch=openwrt-24.10 \
          https://github.com/immortalwrt/immortalwrt.git \
          openwrt

        cd openwrt

        echo "=========================================="
        echo "ImmortalWrt version"
        echo "=========================================="

        git log -1 --oneline

    # ==========================================================
    # 4. feeds
    # ==========================================================
    - name: Configure feeds
      working-directory: openwrt
      run: |

        cat > feeds.conf.default <<'EOF'
        src-git packages https://github.com/immortalwrt/packages.git
        src-git luci https://github.com/immortalwrt/luci.git
        src-git routing https://github.com/openwrt/routing.git
        src-git kenzo https://github.com/kenzok8/openwrt-packages.git
        src-git small https://github.com/kenzok8/small.git
        EOF

        ./scripts/feeds update packages
        ./scripts/feeds update luci
        ./scripts/feeds update routing
        ./scripts/feeds update kenzo
        ./scripts/feeds update small

        ./scripts/feeds install -a -p packages
        ./scripts/feeds install -a -p luci
        ./scripts/feeds install -a -p routing
        ./scripts/feeds install -a -p kenzo
        ./scripts/feeds install -a -p small

    # ==========================================================
    # 5. 检查 JCG Q30
    # ==========================================================
    - name: Check JCG Q30 target
      working-directory: openwrt
      run: |

        echo "=========================================="
        echo "JCG Q30 target"
        echo "=========================================="

        grep -R \
          "jcg_q30" \
          target/linux/mediatek \
          2>/dev/null || true

    # ==========================================================
    # 6. 创建极简配置
    # ==========================================================
    - name: Generate minimal config
      working-directory: openwrt
      run: |

        cat > .config <<'EOF'

        #
        # ========================================================
        # JCG Q30 / MT7981
        # ========================================================
        #

        CONFIG_TARGET_mediatek=y
        CONFIG_TARGET_mediatek_filogic=y
        CONFIG_TARGET_mediatek_filogic_DEVICE_jcg_q30=y


        #
        # ========================================================
        # LuCI
        # ========================================================
        #

        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-ssl=y
        CONFIG_PACKAGE_luci-theme-bootstrap=y

        CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
        CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y


        #
        # ========================================================
        # SSH
        # ========================================================
        #

        


        #
        # ========================================================
        # IPv6
        #
        # DNS/DHCP 不在这里手工配置
        # 交给 ImmortalWrt 默认机制
        # ========================================================
        #

        CONFIG_PACKAGE_odhcp6c=y
        CONFIG_PACKAGE_odhcpd-ipv6only=y
        CONFIG_PACKAGE_luci-proto-ipv6=y


        #
        # ========================================================
        # TPROXY
        # ========================================================
        #

        CONFIG_PACKAGE_kmod-ipt-tproxy=y
        CONFIG_PACKAGE_iptables-mod-tproxy=y
        CONFIG_PACKAGE_kmod-nft-tproxy=y


        #
        # ========================================================
        # TUN
        # ========================================================
        #

        


        #
        # ========================================================
        # SSL
        # ========================================================
        #

        #
        # ========================================================
        # SSR Plus+
        # ========================================================
        #

        CONFIG_PACKAGE_luci-app-ssr-plus=y


        #
        # ========================================================
        # Xray
        # ========================================================
        #

        CONFIG_PACKAGE_xray-core=y


        #
        # ========================================================
        # V2Ray
        # ========================================================
        #

        CONFIG_PACKAGE_v2ray-core=y


        #
        # ========================================================
        # Trojan
        # ========================================================
        #

        CONFIG_PACKAGE_trojan=y


        #
        # ========================================================
        # Hysteria2
        # ========================================================
        #

        CONFIG_PACKAGE_hysteria=y


        #
        # ========================================================
        # 禁止其它代理
        # ========================================================
        #

        CONFIG_PACKAGE_luci-app-passwall=n
        CONFIG_PACKAGE_luci-app-passwall2=n
        CONFIG_PACKAGE_luci-app-homeproxy=n
        CONFIG_PACKAGE_luci-app-openclash=n

        CONFIG_PACKAGE_sing-box=n

        CONFIG_PACKAGE_mosdns=n
        CONFIG_PACKAGE_mosdns-v5=n
        CONFIG_PACKAGE_luci-app-mosdns=n

        CONFIG_PACKAGE_smartdns=n
        CONFIG_PACKAGE_luci-app-smartdns=n

        CONFIG_PACKAGE_kcptun-client=n
        CONFIG_PACKAGE_kcptun-server=n


        #
        # ========================================================
        # 禁止 Shadowsocks / SSR
        # ========================================================
        #

        CONFIG_PACKAGE_shadowsocks-libev-ss-local=n
        CONFIG_PACKAGE_shadowsocks-libev-ss-redir=n
        CONFIG_PACKAGE_shadowsocks-libev-ss-server=n

        CONFIG_PACKAGE_shadowsocksr-libev-ss-local=n
        CONFIG_PACKAGE_shadowsocksr-libev-ss-redir=n
        CONFIG_PACKAGE_shadowsocksr-libev-ss-server=n


        #
        # ========================================================
        # 禁止 NAS
        # ========================================================
        #

        CONFIG_PACKAGE_samba4-server=n
        CONFIG_PACKAGE_samba4-libs=n
        CONFIG_PACKAGE_samba4-utils=n
        CONFIG_PACKAGE_luci-app-samba4=n


        #
        # ========================================================
        # 禁止 aria2
        # ========================================================
        #

        CONFIG_PACKAGE_aria2=n
        CONFIG_PACKAGE_luci-app-aria2=n


        #
        # ========================================================
        # 禁止 QoS
        # ========================================================
        #

        CONFIG_PACKAGE_kmod-sched-cake=n
        CONFIG_PACKAGE_kmod-sched-core=n
        CONFIG_PACKAGE_tc-full=n
        CONFIG_PACKAGE_luci-app-sqm=n


        #
        # ========================================================
        # 禁止 UPnP
        # ========================================================
        #

        CONFIG_PACKAGE_luci-app-upnp=n
        CONFIG_PACKAGE_miniupnpd=n


        #
        # ========================================================
        # 禁止 DLNA
        # ========================================================
        #

        CONFIG_PACKAGE_luci-app-minidlna=n
        CONFIG_PACKAGE_minidlna=n


        #
        # ========================================================
        # 禁止 USB
        # ========================================================
        #

        CONFIG_PACKAGE_kmod-usb-storage=n
        CONFIG_PACKAGE_kmod-usb-storage-uas=n


        #
        # ========================================================
        # 禁止文件系统工具
        # ========================================================
        #

        CONFIG_PACKAGE_kmod-fs-ext4=n
        CONFIG_PACKAGE_kmod-fs-vfat=n
        CONFIG_PACKAGE_kmod-fs-exfat=n

        CONFIG_PACKAGE_e2fsprogs=n
        CONFIG_PACKAGE_mkfs-ext4=n

        CONFIG_PACKAGE_fdisk=n
        CONFIG_PACKAGE_block-mount=n
        CONFIG_PACKAGE_mount-utils=n


        #
        # ========================================================
        # 禁止大型工具
        # ========================================================
        #

        CONFIG_PACKAGE_bash=n
        CONFIG_PACKAGE_gawk=n
        CONFIG_PACKAGE_coreutils=n
        CONFIG_PACKAGE_coreutils-base64=n
        CONFIG_PACKAGE_getopt=n

        CONFIG_PACKAGE_htop=n
        CONFIG_PACKAGE_procps-ng=n

        CONFIG_PACKAGE_bsdtar=n
        CONFIG_PACKAGE_tar=n
        CONFIG_PACKAGE_pigz=n


        #
        # ========================================================
        # 禁止 OpenSSH
        # ========================================================
        #

        CONFIG_PACKAGE_openssh-client=n
        CONFIG_PACKAGE_openssh-server=n
        CONFIG_PACKAGE_openssh-sftp-server=n


        #
        # ========================================================
        # 禁止其它 LuCI 插件
        # ========================================================
        #

        CONFIG_PACKAGE_luci-app-commands=n
        CONFIG_PACKAGE_luci-app-package-manager=n
        CONFIG_PACKAGE_luci-app-opkg=n
        CONFIG_PACKAGE_luci-app-statistics=n
        CONFIG_PACKAGE_luci-app-ddns=n
        CONFIG_PACKAGE_luci-app-watchcat=n
        CONFIG_PACKAGE_luci-app-attendedsysupgrade=n


        #
        # ========================================================
        # 禁止 AdGuard
        # ========================================================
        #

        CONFIG_PACKAGE_adguardhome=n
        CONFIG_PACKAGE_luci-app-adguardhome=n


        #
        # ========================================================
        # 编译系统
        # ========================================================
        #

        CONFIG_DEVEL=n
        CONFIG_CCACHE=y

        EOF

    # ==========================================================
    # 7. 只设置 LAN IP
    #
    # 不碰 DNS
    # 不碰 DHCP
    # 不碰 WAN
    # 不碰 IPv6 DNS
    # ==========================================================
    - name: Set LAN IP
      working-directory: openwrt
      run: |

        mkdir -p files/etc/uci-defaults

        cat > files/etc/uci-defaults/99-jcg-q30-ip <<'EOF'
        #!/bin/sh

        uci set network.lan.ipaddr='192.168.222.1'
        uci set network.lan.netmask='255.255.255.0'

        uci commit network

        exit 0
        EOF

        chmod +x \
          files/etc/uci-defaults/99-jcg-q30-ip

    # ==========================================================
    # 8. 设置 hostname
    # 只改名字，不碰 DNS/NTP/网络
    # ==========================================================
    - name: Set hostname
      working-directory: openwrt
      run: |

        mkdir -p files/etc/uci-defaults

        cat > files/etc/uci-defaults/98-jcg-q30-hostname <<'EOF'
        #!/bin/sh

        uci set system.@system[0].hostname='JCG-Q30'
        uci commit system

        exit 0
        EOF

        chmod +x \
          files/etc/uci-defaults/98-jcg-q30-hostname

    # ==========================================================
    # 9. Defconfig
    # ==========================================================
    - name: Defconfig
      working-directory: openwrt
      shell: bash
      run: |

        make defconfig

        echo
        echo "=========================================="
        echo "TARGET"
        echo "=========================================="

        grep '^CONFIG_TARGET_' .config | grep '=y' || true

        echo
        echo "=========================================="
        echo "SCIENCE PROXY"
        echo "=========================================="

        grep -E \
          '^CONFIG_PACKAGE_(luci-app-ssr-plus|xray-core|v2ray-core|trojan|hysteria)=' \
          .config || true

        echo
        echo "=========================================="
        echo "UNWANTED PROXY CHECK"
        echo "=========================================="

        if grep -E \
          '^CONFIG_PACKAGE_(luci-app-passwall|luci-app-passwall2|luci-app-homeproxy|luci-app-openclash|sing-box|mosdns|smartdns)=' \
          .config | grep '=y'; then

          echo "ERROR: unwanted proxy package found!"
          exit 1

        fi

    # ==========================================================
    # 10. 下载
    # ==========================================================
    - name: Download sources
      working-directory: openwrt
      run: |

        make download \
          -j$(nproc) \
          V=s

    # ==========================================================
    # 11. 编译
    # ==========================================================
    - name: Compile firmware
      working-directory: openwrt
      run: |

        make \
          -j$(nproc) \
          V=s

    # ==========================================================
    # 12. 收集固件
    # ==========================================================
    - name: Collect firmware
      working-directory: openwrt
      run: |

        mkdir -p /tmp/jcg-q30-firmware

        find bin/targets/mediatek/filogic/ \
          -maxdepth 1 \
          -type f \
          -exec cp {} /tmp/jcg-q30-firmware/ \;

        echo
        echo "=========================================="
        echo "FIRMWARE"
        echo "=========================================="

        ls -lh /tmp/jcg-q30-firmware

        echo
        echo "=========================================="
        echo "SHA256"
        echo "=========================================="

        cd /tmp/jcg-q30-firmware
        sha256sum *

    # ==========================================================
    # 13. 上传 Artifact
    # ==========================================================
    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: JCG-Q30-ImmortalWrt-24.10-SSRPlus-MINI
        path: /tmp/jcg-q30-firmware/*
        retention-days: 30

    # ==========================================================
    # 14. GitHub Release
    # ==========================================================
    - name: Create Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: JCG-Q30-24.10-SSRPlus-MINI-${{ github.run_number }}
        name: JCG Q30 ImmortalWrt 24.10 SSR Plus MINI ${{ github.run_number }}
        generate_release_notes: false
        files: /tmp/jcg-q30-firmware/*
        body: |
          JCG Q30 / MT7981
          ImmortalWrt 24.10

          LAN:
          192.168.222.1

          Included:
          - LuCI
          - Chinese LuCI
          - Dropbear SSH
          - IPv6
          - SSR Plus+
          - Xray
          - V2Ray
          - Trojan
          - Hysteria2
          - TPROXY
          - TUN
          - SSL

          DNS:
          Use ImmortalWrt default configuration.

          Removed:
          - PassWall
          - PassWall2
          - HomeProxy
          - OpenClash
          - sing-box
          - MosDNS
          - SmartDNS
          - Kcptun
          - Shadowsocks
          - Samba
          - NAS
          - aria2
          - USB
          - SQM
          - CAKE
          - UPnP
          - DLNA
          - OpenSSH
          - unnecessary utilities
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
